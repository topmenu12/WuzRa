name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build APK
        run: |
          cd src
          echo "Current directory: $(pwd)"
          echo "Listing files:"
          ls -la
          # Run gradlew using bash (no need for execute permission)
          bash gradlew assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WuzenRat-APK
          path: src/app/build/outputs/apk/release/*.apk
